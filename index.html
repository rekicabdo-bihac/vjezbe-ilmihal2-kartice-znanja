Allāhu ekber, Euzubilla, Bismilla, Fatiha i sura."},{"lesson":"BAJRAM-NAMAZ","q":"Kako se klanja drugi rekat?","a":"Bismilla, Fatiha, sura, zatim tri tekbira Allāhu ekber."},{"lesson":"BAJRAM-NAMAZ","q":"Šta slijedi nakon namaza?","a":"Imam drži bajramsku hutbu; slijede čestitanje Bajrama i druženje."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Šta je džuma-namaz?","a":"Sedmični namaz koji se klanja petkom u vrijeme podne-namaza."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Ko je dužan klanjati džumu?","a":"Punoljetni i umno zdravi muslimani. Muslimanke mogu klanjati, ali nisu obavezne."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Koliko je osoba najmanje potrebno?","a":"Četiri: imam i tri muškarca muktedije."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Koliko rekata ima džuma-namaz?","a":"16: četiri sunneta, dva farza, četiri sunneta, četiri ahiri-zuhra i dva sunnetil-vakta."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Šta je prvi ezan?","a":"Poziv džematlijama da dođu na džuma-namaz."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Šta slijedi nakon prvog ezana?","a":"Klanjaju se četiri rekata sunneta."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Šta se dešava poslije drugog ezana?","a":"Imam drži hutbu koju su džematlije dužne saslušati."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Kako se klanja džumanski farz?","a":"Dva rekata u džematu za imamom."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Šta se klanja nakon farza?","a":"Četiri sunneta, četiri ahiri-zuhra i dva sunnetil-vakta."},{"lesson":"DŽUMA-NAMAZ – SEDMIČNI IBADET","q":"Šta znači hutba?","a":"Obraćanje imama, odnosno predavanje prisutnim džematlijama."},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Kada obilježavamo Dan državnosti Bosne i Hercegovine?","a":"25. novembra"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Kada obilježavamo Dan nezavisnosti BiH?","a":"1. marta"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koji je glavni grad BiH?","a":"Sarajevo"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Kolika je površina BiH prema lekciji?","a":"51.209 km²"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koliko je stanovnika BiH bilo prema popisu iz 2013. godine?","a":"3.531.159"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koji je najviši vrh BiH?","a":"Maglić"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koja je visina Maglića prema lekciji?","a":"2.386 metara"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koji je jedini izlaz BiH na more?","a":"Neum"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koja rijeka protječe samo kroz BiH i navedena je kao najduža takva rijeka?","a":"Bosna"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Koje je najveće umjetno jezero u BiH prema lekciji?","a":"Buško jezero"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Kojoj grupi jezika pripada bosanski jezik?","a":"Južnoslavenskim jezicima"},{"lesson":"Moja domovina Bosna i Hercegovina • Bosanski jezik • Kultura i tradicija • Ja sam Bošnjak/Bošnjakinja","q":"Ko je napisao prvi bosansko-turski rječnik?","a":"Mehmed Hevaji Uskufi"},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Šta su mubarek-noći?","a":"Odabrane noći posebne vrijednosti u hidžretskom kalendaru."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Koje se četiri mubarek-noći obrađuju?","a":"Lejletul-kadr, Lejletul-mi’radž, Lejletul-berat i Lejletur-regaib."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Zašto je značajna Lejletul-kadr?","a":"U njoj je počela objava Kur’ana; vrednija je od hiljadu mjeseci."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Kada se traži Lejletul-kadr?","a":"U neparnim noćima posljednjih deset dana ramazana; u gradivu se spominje 27. noć."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Šta je Isra?","a":"Putovanje Muhammeda, a.s., od Kabe u Mekki do Mesdžidul-Aksaa u Jerusalemu."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Šta je Mi’radž?","a":"Uzdignuće Poslanika, a.s., kroz sedam nebesa do Sidretul-muntehaa."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Šta je Lejletul-berat?","a":"Petnaesta noć ša’bana; naziva se i Noć oprosta."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Kada se obilježava Lejletur-regaib?","a":"Uoči prvog petka mjeseca redžeba; poznata je i kao Noć želja."},{"lesson":"VAŽNOST I ZNAČAJ MUBAREK-NOĆI","q":"Kako provodimo mubarek-noći?","a":"Dobrovoljnim namazom, dovom, zikrom, učenjem Kur’ana i korisnim mevludskim programima."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta učimo na prvom rekatu farza?","a":"Subhaneke, Euzubilla, Bismilla, Fatiha i jedna sura."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta učimo na drugom rekatu farza?","a":"Bismilla, Fatiha i jedna sura."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta učimo na trećem i četvrtom rekatu farza?","a":"Bismilla i Fatiha."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta učimo na prvom sjedenju farza?","a":"Et-Tehijjatu do salavata."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta učimo na posljednjem sjedenju?","a":"Et-Tehijjatu, salavate i dove, a zatim predajemo selam."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Po čemu se podnevski sunnet razlikuje od farza?","a":"Na trećem i četvrtom rekatu uz Fatihu uči se i sura."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta učimo na prvom sjedenju ikindijskog i jacijskog sunneta?","a":"Et-Tehijjatu i salavate."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta je posebno na trećem rekatu ikindijskog i jacijskog sunneta?","a":"Ponovo se uče Subhaneke i Euzubilla, pa Bismilla, Fatiha i sura."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Koliko rekata ima vitr i kada se klanja?","a":"Tri rekata; klanja se poslije jacije."},{"lesson":"TABELARNI PREGLED NAČINA KLANJANJA PET DNEVNIH NAMAZA","q":"Šta se uči na trećem rekatu vitr-namaza?","a":"Bismilla, Fatiha, sura, zatim tekbir i Kunut-dova."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Šta je teravih-namaz?","a":"Namaz koji se klanja u noćima mjeseca ramazana."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Kakav je propis teravih-namaza?","a":"Pritvrđeni sunnet."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Gdje ga je najbolje klanjati?","a":"U džamiji za imamom."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Kada se klanja?","a":"U jacijsko vrijeme, poslije jacijskog sunneta, a prije vitr-namaza."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Koliko ima rekata?","a":"Dvadeset rekata."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Kada se predaje selam?","a":"Nakon svaka dva ili nakon svaka četiri rekata."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Kako se klanja po četiri rekata?","a":"Kao jacijski sunnet."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Kako se klanja po dva rekata?","a":"Kao jacijski sunsunnet."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Šta je lijepo učiniti nakon četiri rekata?","a":"Napraviti kratku pauzu uz zikr ili salavate."},{"lesson":"TERAVIH-NAMAZ – RAMAZANSKI IBADET","q":"Koji se ramazanski ibadeti spominju?","a":"Post, mukabela, sadekatul-fitr i itikaf."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Šta je urednost?","a":"Čistoća, lijepo ponašanje i sklad u odijevanju i prostoru."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Kako musliman čuva urednost?","a":"Održava čistim tijelo, odjeću, dom i okolinu."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Ko nam je uzor u urednosti?","a":"Muhammed, a.s., bio je primjer urednosti."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Šta je lična higijena?","a":"Svakodnevna briga o čistoći vlastitog tijela."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Kada peremo ruke?","a":"Prije i poslije jela te nakon obavljene nužde."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Koje navike čuvaju ličnu higijenu?","a":"Pranje zuba, kupanje, podrezivanje noktiju i čista odjeća."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Šta znači hadis „Čistoća je pola vjere“?","a":"Naglašava veliki značaj čistoće u islamu."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Zašto trebamo čuvati zdravlje?","a":"Zdravlje je Allahova blagodat i naša je dužnost brinuti o njemu."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Kako čuvamo zdravlje?","a":"Zdravom ishranom, umjerenim radom i snom, sportom i rekreacijom."},{"lesson":"UREDNOST, ČISTOĆA I ZDRAVLJE MUSLIMANA","q":"Šta radimo kada se razbolimo?","a":"Tražimo liječenje i brinemo o zdravlju."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Šta su nafila-namazi?","a":"Dobrovoljni namazi za koje je obećana dodatna nagrada."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Gdje je lijepo klanjati nafile?","a":"Mogu se klanjati u džamiji i kod kuće; Poslanik, a.s., podsticao je na obavljanje kod kuće."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Kada se klanja duha-namaz?","a":"Od 45 minuta nakon izlaska Sunca do pred podne; dva, četiri, šest ili osam rekata."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Šta je salatul-lejl?","a":"Noćni namaz, posebno vrijedan dobrovoljni namaz."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Šta je tehijjetul-mesdžid?","a":"Dva rekata pri ulasku u džamiju, prije sjedenja."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Šta je istihara-namaz?","a":"Dva rekata i dova za Allahovu uputu pri donošenju važne odluke."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Šta je salatul-hadže?","a":"Dva rekata namaza za želju ili potrebu uz dovu Allahu."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Šta je salatut-tevba?","a":"Dva rekata namaza za pokajanje, uz dovu za oprost."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Koji su namazi vezani za posebne prilike?","a":"Nakon povratka s putovanja, namaz za kišu i namaz pomračenja Sunca i Mjeseca."},{"lesson":"VRSTE NAFILA-NAMAZA","q":"Kada ne treba klanjati nafile?","a":"U vremenima kada je namaz zabranjen: pri izlasku i zalasku Sunca i kada je Sunce na polovini neba."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Šta je zdrava ishrana?","a":"Jesti raznovrsnu, korisnu i halal hranu u umjerenim količinama."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Šta poručuje ajet El-A’raf, 31?","a":"Da jedemo i pijemo, ali ne pretjerujemo."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Koje su namirnice spomenute u Kur’anu?","a":"Med, smokve, masline, grožđe, voda, mlijeko i druge."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Koja je hrana i piće zabranjeno u lekciji?","a":"Svinjsko meso, krv, meso uginulih i određenih životinja te alkoholna pića."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Šta radimo prije jela?","a":"Pripremimo halal hranu, operemo ruke i proučimo Bismillu."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Kako jedemo prema sunnetu?","a":"Desnom rukom, ispred sebe, bez pretjerivanja i bez prigovaranja hrani."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Šta radimo poslije jela?","a":"Zahvalimo Allahu i operemo ruke, usta i zube."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Kako zahvaljujemo Allahu poslije jela?","a":"Učimo dovu ili kažemo El-hamdu lillah – Hvala Allahu."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Šta ako zaboravimo Bismillu prije jela?","a":"Kada se sjetimo, kažemo: Bismillahi fi evvelihi ve ahirihi."},{"lesson":"ZDRAVA ISHRANA I ISLAMSKI BONTON ZA STOLOM","q":"Zašto je važno lijepo ponašanje za stolom?","a":"Time pokazujemo zahvalnost Allahu, poštovanje prema drugima i čuvamo zdravlje."},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Prvi čovjek","a":"Adem, a.s."},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Prva žena","a":"Hava"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Stvoritelj","a":"Allah, dž.š."},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Adem je stvoren","a":"Od zemlje"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Prvo boravište","a":"Džennet"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Vođa šejtana","a":"Iblis"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Zabrana","a":"Ne približavati se"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Nakon greške","a":"Pokajanje"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Dova pokajanja","a":"El-A‘raf, 23"},{"lesson":"ADEM, A.S. – INTERAKTIVNA LEKCIJA","q":"Pouka o Ademu as","a":"Čuvati se šejtana i tražiti oprost"},{"lesson":"Grijesi i tevba – pokajanje","q":"Šta je grijeh?","a":"Ono što je Allah zabranio i kršenje Njegovih granica."},{"lesson":"Grijesi i tevba – pokajanje","q":"Kako se dijele grijesi?","a":"Na male, velike i teške."},{"lesson":"Grijesi i tevba – pokajanje","q":"Kako se brišu mali grijesi?","a":"Tevbom i dobrim djelima."},{"lesson":"Grijesi i tevba – pokajanje","q":"Šta su veliki grijesi?","a":"Zabranjena djela uz prijetnju kaznom."},{"lesson":"Grijesi i tevba – pokajanje","q":"Navedi primjere velikih grijeha.","a":"Ubistvo, neposlušnost roditeljima, laž i ogovaranje."},{"lesson":"Grijesi i tevba – pokajanje","q":"Šta je širk?","a":"Pripisivanje druga Allahu."},{"lesson":"Grijesi i tevba – pokajanje","q":"Šta je nifak?","a":"Licemjerstvo u vjeri."},{"lesson":"Grijesi i tevba – pokajanje","q":"Koje su posljedice grijeha?","a":"Šteta vjeri, zdravlju, porodici i društvu."},{"lesson":"Grijesi i tevba – pokajanje","q":"Šta je tevba?","a":"Iskreno pokajanje Allahu za učinjeni grijeh."},{"lesson":"Grijesi i tevba – pokajanje","q":"Koji su uvjeti tevbe?","a":"Prestanak grijeha, kajanje, odluka da se ne ponovi i vraćanje tuđih prava."},{"lesson":"Ikindija-namaz","q":"Koliko rekata ima ikindija-namaz?","a":"Osam: četiri sunneta i četiri farza."},{"lesson":"Ikindija-namaz","q":"Koji je ikindija-namaz po redu?","a":"Treći dnevni namaz."},{"lesson":"Ikindija-namaz","q":"Kada je vrijeme ikindije?","a":"Na sredini vremena između podneva i zalaska Sunca."},{"lesson":"Ikindija-namaz","q":"Šta se prvo klanja?","a":"Četiri rekata sunneta."},{"lesson":"Ikindija-namaz","q":"Šta se klanja poslije sunneta?","a":"Četiri rekata farza."},{"lesson":"Ikindija-namaz","q":"Šta se uči na prvom rekatu?","a":"Subhaneke, Euzubilla, Bismilla, Fatiha i sura."},{"lesson":"Ikindija-namaz","q":"Šta se uči na prvom sjedenju sunneta?","a":"Et-Tehijjatu i salavati."},{"lesson":"Ikindija-namaz","q":"Šta se uči na trećem rekatu sunneta?","a":"Subhaneke, Bismilla, Fatiha i sura."},{"lesson":"Ikindija-namaz","q":"Šta se uči na trećem i četvrtom rekatu farza?","a":"Bismilla i Fatiha."},{"lesson":"Ikindija-namaz","q":"Šta se uči na posljednjem sjedenju?","a":"Et-Tehijjatu, salavati, dove i predaja selama."},{"lesson":"Jacija-namaz","q":"Koliko ukupno rekata ima jacija-namaz?","a":"13: četiri sunneta, četiri farza, dva sunsunneta i tri vitr-namaza."},{"lesson":"Jacija-namaz","q":"Kada nastupa jacija?","a":"Kada noć potpuno nastupi."},{"lesson":"Jacija-namaz","q":"Kojim redom se klanja jacija?","a":"Sunnet, farz, sunsunnet i na kraju vitr."},{"lesson":"Jacija-namaz","q":"Šta se uči na prvom rekatu sunneta?","a":"Subhaneke, Euzubilla, Bismilla, Fatiha i sura."},{"lesson":"Jacija-namaz","q":"Šta se uči na prvom sjedenju sunneta?","a":"Et-Tehijjatu i salavati."},{"lesson":"Jacija-namaz","q":"Šta se uči na trećem rekatu sunneta?","a":"Subhaneke, Bismilla, Fatiha i sura."},{"lesson":"Jacija-namaz","q":"Šta se uči na trećem i četvrtom rekatu farza?","a":"Bismilla i Fatiha."},{"lesson":"Jacija-namaz","q":"Koliko rekata ima sunsunnet?","a":"Dva rekata."},{"lesson":"Jacija-namaz","q":"Šta se uči na prvom sjedenju vitra?","a":"Et-Tehijjatu."},{"lesson":"Jacija-namaz","q":"Šta se uči na trećem rekatu vitr-namaza?","a":"Bismilla, Fatiha i sura; zatim tekbir i Kunut-dova."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Zašto je važno stjecati znanje?\n   Odgovor: Da bismo bili korisni sebi i drugima.","a":"Mesh po mestvama i zavoju"},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Šta je mesh?","a":"Potiranje mokrom rukom po dijelu tijela ili nečemu drugom."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Šta su mestve?","a":"Lahka kućna obuća, najčešće kožna."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Kada se koriste mestve kao olakšica?","a":"Pri abdestu, naročito za vrijeme bolesti, hladnoće ili putovanja."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Kada se obuvaju mestve?","a":"Nakon uzimanja abdesta."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Kako se čini mesh po mestvama?","a":"Mokrom rukom potire se gornji dio mestve od prstiju prema člancima."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Koliko traje mesh za osobu kod kuće?","a":"24 sata."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Koliko traje mesh za putnika?","a":"72 sata."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Kada mesh po mestvama nije valjan?","a":"Kad su mestve poderane, prljave, ne pokrivaju članke ili su obučene prije abdesta."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Šta kvari mesh po mestvama?","a":"Skidanje mestvi i istek vremena korištenja olakšice."},{"lesson":"LIJEPE OSOBINE MUSLIMANA","q":"Kako se čini mesh po zavoju?","a":"Mokrom rukom potire se zavoj, gips ili langeta na povrijeđenom dijelu."},{"lesson":"Naklanjavanje namaza","q":"Šta je naklanjavanje?","a":"Obavljanje propuštenog namaza"},{"lesson":"Naklanjavanje namaza","q":"Šta je faita?","a":"Izostavljeni namaz"},{"lesson":"Naklanjavanje namaza","q":"Šta je vaktija?","a":"Namaz čije je vrijeme u toku"},{"lesson":"Naklanjavanje namaza","q":"Koji namazi se naklanjavaju?","a":"Farzovi pet dnevnih namaza i vitr"},{"lesson":"Naklanjavanje namaza","q":"Naklanjavaju li se sunneti?","a":"U pravilu ne, uz navedeni izuzetak sabahskog"},{"lesson":"Naklanjavanje namaza","q":"Kada je izuzetak za sabahski sunnet?","a":"Istog dana nakon izlaska Sunca"},{"lesson":"Naklanjavanje namaza","q":"Kako se naklanjava redoslijedom?","a":"Kako su namazi trebali biti klanjani"},{"lesson":"Naklanjavanje namaza","q":"Manje od šest propuštenih?","a":"Prvo propušteni, zatim redovni"},{"lesson":"Naklanjavanje namaza","q":"Šest ili više propuštenih?","a":"Prvo redovni, zatim propušteni"},{"lesson":"Naklanjavanje namaza","q":"Koja se riječ mijenja u nijetu?","a":"EDĀEN zamjenjujemo riječju KAḌĀEN"},{"lesson":"Namaz u džematu","q":"Šta je namaz u džematu?","a":"Zajedničko klanjanje"},{"lesson":"Namaz u džematu","q":"Koliko je vredniji?","a":"25 ili 27 puta od pojedinačnog"},{"lesson":"Namaz u džematu","q":"Koji farzovi se klanjaju u džematu?","a":"Farzovi pet dnevnih namaza"},{"lesson":"Namaz u džematu","q":"Koji namazi samo u ramazanu?","a":"Vitr i teravih"},{"lesson":"Namaz u džematu","q":"Koji namazi isključivo u džematu?","a":"Džuma, bajram i dženaza"},{"lesson":"Namaz u džematu","q":"Koliko osoba treba za dzemat najmanje?","a":"Dvije"},{"lesson":"Namaz u džematu","q":"Ko je imam?","a":"Predvodnik džemata"},{"lesson":"Namaz u džematu","q":"Ko je muktedija?","a":"Onaj koji klanja za imamom"},{"lesson":"Namaz u džematu","q":"Šta dodajemo u nijetu?","a":"IKTEDEJTU BI HĀẔEL-IMĀMI"},{"lesson":"Namaz u džematu","q":"Šta muktedija uči na prvom rekatu?","a":"Subhaneke"},{"lesson":"Namaz bolesnika","q":"Kako klanja bolesnik koji ne može stajati?","a":"Klanja sjedeći."},{"lesson":"Namaz bolesnika","q":"Kako se čine ruku i sedžda sjedeći?","a":"Išaretom; pri sedždi se naginje više nego pri rukuu."},{"lesson":"Namaz bolesnika","q":"Šta ako bolesnik ne može ni sjediti?","a":"Klanja ležeći, prema mogućnostima."},{"lesson":"Namaz bolesnika","q":"Kako se okreće kada klanja ležeći?","a":"Prema Kibli, ako je moguće."},{"lesson":"Namaz bolesnika","q":"Šta može učiniti s nogama pri ležanju?","a":"Može ih saviti u koljenima."},{"lesson":"Namaz bolesnika","q":"Zašto podiže glavu pri ležanju?","a":"Da bi njome mogao obavljati namaske pokrete."},{"lesson":"Namaz bolesnika","q":"Kako klanja osoba koja ne može pomjerati nijedan dio tijela?","a":"U mislima."},{"lesson":"Namaz bolesnika","q":"Šta ako teško stanje potraje najviše dan i noć?","a":"Prema gradivu, naklanjaju se propušteni namazi."},{"lesson":"Namaz bolesnika","q":"Šta ako koma ili nesvijest traje duže od jednog dana i noći?","a":"Prema gradivu, nema obaveze naklanjavanja propuštenih namaza."},{"lesson":"Namaz bolesnika","q":"Šta nas uči El-Bekare, 286?","a":"Allah nikoga ne opterećuje preko njegovih mogućnosti."},{"lesson":"Namaz čuva i odgaja","q":"Od čega nas namaz čuva?","a":"Od ružnih misli, namjera, zlih djela i grijeha"},{"lesson":"Namaz čuva i odgaja","q":"Kako namaz djeluje na naše misli?","a":"Budi plemenite misli i potiče nas na dobro"},{"lesson":"Namaz čuva i odgaja","q":"Na šta nas podsjeća namaz?","a":"Na stajanje pred Stvoriteljem i polaganje računa"},{"lesson":"Namaz čuva i odgaja","q":"Koje osobine razvija namaz?","a":"Tačnost, preciznost i organiziranost"},{"lesson":"Namaz čuva i odgaja","q":"Koju naviku namaz pomaže otkloniti?","a":"Lijenost"},{"lesson":"Namaz čuva i odgaja","q":"S čim je Poslanik uporedio pet dnevnih namaza?","a":"S kupanjem u rijeci pet puta dnevno"},{"lesson":"Namaz čuva i odgaja","q":"Šta pet dnevnih namaza brišu?","a":"Grijehe"},{"lesson":"Namaz čuva i odgaja","q":"Šta se naređuje u ajetu Ta-Ha, 132?","a":"Da porodici naređujemo namaz i ustrajemo u njemu"},{"lesson":"Namaz čuva i odgaja","q":"Za šta će čovjek prvo biti pitan na Sudnjem danu?","a":"Za namaz"},{"lesson":"Namaz čuva i odgaja","q":"Šta je posljedica ispravnog namaza u navedenom hadisu?","a":"Bit će ispravna i ostala djela"},{"lesson":"Namaz putnika","q":"Ko je musafir?","a":"Putnik koji iz mjesta stanovanja krene na put od najmanje 80 kilometara."},{"lesson":"Namaz putnika","q":"Koji farzovi se skraćuju?","a":"Četverorekatni farzovi skraćuju se na dva rekata."},{"lesson":"Namaz putnika","q":"Da li se skraćuju sabah i akšam?","a":"Ne. Sabahski i akšamski farz se ne skraćuju."},{"lesson":"Namaz putnika","q":"Kako se klanja vitr?","a":"Vitr-namaz klanja se bez skraćivanja."},{"lesson":"Namaz putnika","q":"Šta je sa sunnetima?","a":"Putnik nije obavezan klanjati sunnete; ako ima vremena, klanja ih bez skraćivanja."},{"lesson":"Namaz putnika","q":"Kako musafir klanja iza imama koji nije putnik?","a":"Klanja bez skraćivanja."},{"lesson":"Namaz putnika","q":"Šta rade muktedije koji nisu putnici iza imama-musafira?","a":"Nakon imamovog selama ustaju i klanjaju treći i četvrti rekat."},{"lesson":"Namaz putnika","q":"Kako se klanja u prijevoznom sredstvu?","a":"Ako se ne može drukčije, sjedeći prema Kibli ako je moguće, uz ruku i sedždu išaretom."},{"lesson":"Namaz putnika","q":"Koliko traje olakšica boravka?","a":"Ako se namjerava zadržati do 15 dana, olakšice važe; za boravak duži od 15 dana prestaju."},{"lesson":"Namaz putnika","q":"Kada prestaju putničke olakšice?","a":"Po povratku u mjesto stanovanja."},{"lesson":"Naša porodica i rodbina","q":"Kako govorimo roditeljima?","a":"Blago, lijepo i s poštovanjem."},{"lesson":"Naša porodica i rodbina","q":"Šta znači dobročinstvo roditeljima?","a":"Pomagati im, slušati ih u dobru i brinuti o njima."},{"lesson":"Naša porodica i rodbina","q":"Koja sura govori o poštovanju roditelja?","a":"El-Isra, 23–24."},{"lesson":"N function start(mode,forced){let p=forced||pool(),n=$('count').value;p=$('order').value==='random'?shuffle(p):[...p];if(n!=='all')p=p.slice(0,+n);if(mode==='challenge')p=p.slice(0,20);if(!p.length)return;window.trackKartice('game_start',{mode,lesson:$('lesson').selectedOptions[0]?.text||'Sve lekcije',question_count:p.length});state={mode,p,index:0,correct:0,wrong:0,locked:false,round:[],pairDone:0,attempt:0};$('setup').hidden=true;$('play').hidden=false;$('modeTitle').textContent=MODES.find(m=>m[0]===mode)[1];window.scrollTo(0,0);render()}

function flip(x){$('stage').innerHTML=`<button class="flip" id="flip"><span class="small">${esc(x.lesson)} · Dodirni karticu</span><div class="question">${esc(x.q)}</div><div class="answer" id="flipped" hidden>${esc(x.a)}</div></button>`;let shown=false;$('flip').onclick=()=>{shown=!shown;$('flipped').hidden=!shown;$('flip').classList.toggle('revealed',shown)};actions('<button class="good" id="know">✓ Znam</button><button class="bad" id="dont">↻ Ponovi</button>');$('know').onclick=()=>result(x,true);$('dont').onclick=()=>result(x,false,x.a)}

function truth(x){let wrong=DATA.filter(v=>v.a!==x.a),yes=Math.random()<.5,shown=yes?x.a:shuffle(wrong)[0].a;$('stage').innerHTML=`<p class="small">${esc(x.lesson)}</p><div class="question">${esc(x.q)}</div><div class="answer">${esc(shown)}</div><p>Je li prikazani odgovor tačan?</p>`;actions('<button class="good" id="yes">✓ Tačno</button><button class="bad" id="no">✕ Netačno</button>');$('yes').onclick=()=>result(x,yes,yes?'':x.a);$('no').onclick=()=>result(x,!yes,!yes?'':x.a)}

else{let cards=shuffle([...subset.map(x=>({id:x.id,type:'q',txt:x.q})),...subset.map(x=>({id:x.id,type:'a',txt:x.a}))]);$('stage').innerHTML=`<p class="small">Pronađi par: pitanje i odgovor</p><div class="memgrid">${cards.map((c,i)=>`<button class="memtile" data-card="${i}">❔</button>`).join('')}</div>`;document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(busy||b.disabled||turned.some(t=>t.i===+b.dataset.card))return;let i=+b.dataset.card,c=cards[i];b.textContent=c.txt;b.classList.add('selected');turned.push({i,c});if(turned.length===2){busy=true;let [a,z]=turned,ok=a.c.id===z.c.id&&a.c.type!==z.c.type;judge(a.c.id,ok?z.c.id:-1);setTimeout(()=>{for(let t of turned){let el=document.querySelector(`[data-card="${t.i}"]`);if(ok){el.classList.add('correct');el.disabled=true}else{el.textContent='❔';el.classList.remove('selected')}}turned=[];busy=false;endIf()},ok?350:850)}})}
